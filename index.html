<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="description" content="NEOdonto — Dashboard de gestão odontológica"/>
  <title>NEOdonto — Dashboard</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <div class="app">
    <!-- Mobile -->
    <button class="mobile-toggle" id="mobile-toggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h2>Dashboard</h2>
          <p id="greeting">Carregando...</p>
        </div>
      </header>

      <div class="page" id="dash-content">
        <div class="page-loader"><span class="spinner"></span> Carregando...</div>
      </div>
    </main>
  </div>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script type="module" src="js/app.js"></script>

</body>
</html>
