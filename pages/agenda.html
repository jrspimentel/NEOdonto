<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="description" content="NEOdonto — Agenda do dia"/>
  <title>NEOdonto — Agenda do Dia</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

  <div class="app">
    <button class="mobile-toggle" id="mobile-toggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h2>Agenda do Dia</h2>
          <p>Acompanhe os atendimentos do período</p>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-p btn-sm" id="btn-new-appointment">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Novo Agendamento
          </button>
        </div>
      </header>

      <div class="page">
        <!-- Date Range Filter -->
        <div class="filters-row" style="gap:12px;align-items:center;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:8px">
            <input type="date" id="date-start" class="input-date"/>
            <span style="color:var(--t3);font-size:.85rem">até</span>
            <input type="date" id="date-end" class="input-date"/>
          </div>
          <button class="btn btn-s btn-sm" id="btn-today">Hoje</button>
        </div>

        <!-- Status Filters -->
        <div class="tabs" style="margin-bottom:18px">
          <button class="tab active" data-filter="all">Todos</button>
          <button class="tab" data-filter="agendados">Agendados</button>
          <button class="tab" data-filter="recepcao">Recepção</button>
          <button class="tab" data-filter="atendimento">Em atendimento</button>
          <button class="tab" data-filter="finalizados">Finalizados</button>
          <button class="tab" data-filter="faltou">Faltou</button>
          <button class="tab" data-filter="cancelados">Cancelados</button>
          <button class="tab" data-filter="reagendados">Reagendados</button>
        </div>

        <!-- Agenda Table -->
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead id="agenda-thead">
                <tr>
                  <th>Profissional</th>
                  <th>Paciente</th>
                  <th>Procedimento</th>
                  <th>Convênio</th>
                  <th>Hora</th>
                  <th>Status</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="agenda-tbody">
                <tr><td colspan="7"><div class="page-loader"><span class="spinner"></span> Carregando...</div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Appointment Modal -->
  <div class="modal-overlay" id="ag-overlay">
    <div class="modal">
      <div class="modal-head">
        <h3 id="ag-modal-title">Novo Agendamento</h3>
        <button class="btn-icon" id="ag-modal-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="ag-form">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group">
              <label>Profissional *</label>
              <select name="professional_id" required>
                <option value="">Selecione...</option>
              </select>
            </div>
            <div class="form-group">
              <label>Paciente *</label>
              <select name="patient_id" required>
                <option value="">Selecione...</option>
              </select>
            </div>
            <div class="form-group">
              <label>Procedimento *</label>
              <select name="procedure_id" required>
                <option value="">Selecione...</option>
              </select>
            </div>
            <div class="form-group">
              <label>Convênio *</label>
              <select name="insurance_id" required>
                <option value="">Selecione...</option>
              </select>
            </div>
            <div class="form-group">
              <label>Data *</label>
              <input type="date" name="appointment_date" required/>
            </div>
            <div class="form-group">
              <label>Hora *</label>
              <input type="time" name="appointment_time" required/>
            </div>
            <div class="form-group full">
              <label>Status</label>
              <select name="status">
                <option>Agendado</option>
                <option>Paciente na recepção</option>
                <option>Em atendimento</option>
                <option>Finalizado</option>
                <option>Faltou</option>
                <option>Cancelado</option>
                <option>Reagendado</option>
              </select>
            </div>
            <div class="form-group full">
              <label>Observações</label>
              <textarea name="notes" placeholder="Notas..."></textarea>
            </div>
          </div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-s" id="ag-modal-cancel">Cancelar</button>
          <button type="submit" class="btn btn-p">Salvar Agendamento</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="del-overlay">
    <div class="modal" style="max-width:420px">
      <div class="modal-head">
        <h3>Confirmar Exclusão</h3>
        <button class="btn-icon" id="del-modal-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <p>Deseja realmente excluir este agendamento?</p>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-s" id="del-cancel">Cancelar</button>
        <button type="button" class="btn btn-d" id="del-confirm">Excluir</button>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toast-wrap"></div>
  <script type="module" src="../js/agenda.js"></script>
</body>
</html>
